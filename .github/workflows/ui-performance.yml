name: UI CPU performance
on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Git revision to use as the baseline
        required: true
        default: main
        type: string
permissions:
  contents: read
concurrency:
  group: ui-performance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: ui-performance-${{ runner.os }}-${{ runner.arch }}
          cmd-format: mise exec -- {0}
          cache-bin: false
      - name: Validate comparison tooling
        run: python3 scripts/ui-performance-test.py
      - name: Compare release-mode CPU benchmarks
        env:
          UI_BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_ref }}
        run: python3 scripts/ui-performance.py --base "$UI_BASE_SHA" --output target/ui-performance-report
      - name: Preserve timings and build logs, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-performance-${{ github.run_id }}
          path: target/ui-performance-report/
          if-no-files-found: warn
