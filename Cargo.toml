[package]
name = "rustable"
version = "0.2.0"
edition = "2024"
description = "A responsive native database workspace built with Rust and egui"
license = "MIT"

[features]
qa = ["objc2-app-kit/NSEvent"]
sparkle-updater = ["dep:sparkle-updater"]

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "persistence"] }
egui_extras = { version = "0.33", features = ["svg"] }
rusqlite = { version = "0.40.1", features = ["bundled", "hooks", "limits", "serialize"] }
serde = { version = "1", features = ["derive", "rc"] }
bincode = "1.3"
serde_json = "1"
rfd = "0.15"
regex = "1"
tempfile = "3"
same-file = "1"
csv = "1"
sqlformat = "0.5"
sqlparser = { version = "0.63.0", default-features = false, features = ["std"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "wasmbind"] }
web-time = "1.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
postgres = "0.19"
postgres-native-tls = "0.5"
native-tls = "0.2"
keyring = { version = "4.2", default-features = false, features = ["v1"] }
tokio = { version = "1.54.1", features = ["rt", "time"] }
tokio-postgres = "0.7.18"
mysql = { version = "28.0.4", default-features = false, features = ["minimal-rust", "rustls-tls-ring"] }
redis = { version = "1.8.1", default-features = false, features = ["tls-native-tls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Worker", "WorkerOptions", "WorkerType", "MessageEvent", "ErrorEvent"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Keep release optimizations while retaining symbols for native CPU profiles.
[profile.profiling]
inherits = "release"
debug = 1
strip = false

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSObject", "NSArray"] }
sparkle-updater = { version = "=0.1.0", optional = true }


# Preserve typed empty-result metadata without an extra prepare round trip.
# See vendor/README.md for the minimal upstream patches.
[patch.crates-io]
postgres = { path = "vendor/postgres" }
tokio-postgres = { path = "vendor/tokio-postgres" }

eframe = { path = "vendor/eframe" }

egui_extras = { path = "vendor/egui_extras" }

mysql = { path = "vendor/mysql" }

egui = { path = "vendor/egui" }
