[package]
name = "rustable-postgres-language-server"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
pgls_lsp = { git = "https://github.com/supabase-community/postgres-language-server.git", tag = "0.28.1" }
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "macros"] }
pgls_completions = { git = "https://github.com/supabase-community/postgres-language-server.git", tag = "0.28.1" }
pgls_catalog = { git = "https://github.com/supabase-community/postgres-language-server.git", tag = "0.28.1" }
pgls_text_size = { git = "https://github.com/supabase-community/postgres-language-server.git", tag = "0.28.1" }
pgls_treesitter_grammar = { git = "https://github.com/supabase-community/postgres-language-server.git", tag = "0.28.1" }
pgls_statement_splitter = { git = "https://github.com/supabase-community/postgres-language-server.git", tag = "0.28.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.25.9"
pgls_lexer = { git = "https://github.com/supabase-community/postgres-language-server.git", tag = "0.28.1", version = "0.0.0" }
