[package]
name = "rustable-browser"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rustable = { path = "../.." }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow"] }
egui_extras = "0.33"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1

[patch.crates-io]
eframe = { path = "../../vendor/eframe" }
egui_extras = { path = "../../vendor/egui_extras" }
postgres = { path = "../../vendor/postgres" }
tokio-postgres = { path = "../../vendor/tokio-postgres" }
